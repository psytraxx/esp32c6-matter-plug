<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e8449"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2471a3"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="620" fill="#ffffff"/>

  <!-- Title -->
  <text x="30" y="34" font-size="20" font-weight="700" fill="#1a1a1a">Wiring</text>

  <!-- Column headers -->
  <text x="310" y="70" font-size="13" font-weight="700" fill="#555" text-anchor="middle">plug board net</text>
  <text x="590" y="70" font-size="13" font-weight="700" fill="#555" text-anchor="middle">CB2S pad</text>
  <text x="870" y="70" font-size="13" font-weight="700" fill="#555" text-anchor="middle">XIAO pad</text>

  <!-- Safety banner -->
  <rect x="30" y="84" width="1020" height="34" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="540" y="106" font-size="13" fill="#8e2b1f" text-anchor="middle" font-weight="600">⚠ The plug&#8217;s low-voltage section is not isolated from mains. Every pad below can sit at mains potential.</text>

  <!-- Row template: y-start 140, row height 42. Left label column right-edge at x=220. -->
  <!-- Row 1: 3V3 -->
  <g>
    <text x="220" y="150" font-size="13" fill="#1a1a1a" text-anchor="end">AMS1117 3.3&#160;V</text>
    <line x1="230" y1="146" x2="410" y2="146" stroke="#c0392b" stroke-width="1.6"/>
    <rect x="540" y="132" width="100" height="26" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/>
    <text x="590" y="149" font-size="12.5" fill="#8e2b1f" text-anchor="middle" font-weight="600">3V3</text>
    <line x1="640" y1="146" x2="810" y2="146" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrowRed)"/>
    <text x="870" y="150" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="600">3V3-OUT</text>
  </g>

  <!-- Row 2: relay -->
  <g>
    <text x="220" y="192" font-size="13" fill="#1a1a1a" text-anchor="end">Relay drive</text>
    <line x1="230" y1="188" x2="410" y2="188" stroke="#c0392b" stroke-width="1.6" marker-start="url(#arrowRed)"/>
    <rect x="540" y="174" width="100" height="26" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/>
    <text x="590" y="191" font-size="12.5" fill="#8e2b1f" text-anchor="middle" font-weight="600">P26</text>
    <line x1="640" y1="188" x2="810" y2="188" stroke="#c0392b" stroke-width="1.6"/>
    <text x="870" y="192" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="600">D5 &#183; GPIO23</text>
  </g>

  <!-- Row 3: GND -->
  <g>
    <text x="220" y="234" font-size="13" fill="#1a1a1a" text-anchor="end">ground pour</text>
    <line x1="230" y1="230" x2="410" y2="230" stroke="#555" stroke-width="1.4"/>
    <rect x="540" y="216" width="100" height="26" rx="4" fill="#ffffff" stroke="#777" stroke-width="1.2"/>
    <text x="590" y="233" font-size="12.5" fill="#333" text-anchor="middle" font-weight="600">GND</text>
    <line x1="640" y1="230" x2="810" y2="230" stroke="#555" stroke-width="1.4"/>
    <text x="870" y="234" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="600">GND</text>
  </g>

  <!-- Row 4: LED (WiFi LED / network LED) -->
  <g>
    <text x="220" y="276" font-size="13" fill="#1a1a1a" text-anchor="end">WiFi LED (network state)</text>
    <line x1="230" y1="272" x2="410" y2="272" stroke="#1e8449" stroke-width="1.6" marker-start="url(#arrowGreen)"/>
    <rect x="540" y="258" width="100" height="26" rx="4" fill="#ffffff" stroke="#1e8449" stroke-width="1.4"/>
    <text x="590" y="275" font-size="12.5" fill="#1e8449" text-anchor="middle" font-weight="600">P8</text>
    <line x1="640" y1="272" x2="810" y2="272" stroke="#1e8449" stroke-width="1.6"/>
    <text x="870" y="276" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="600">D4 &#183; GPIO22</text>
  </g>

  <!-- Row 5: button (RX1) -->
  <g>
    <text x="220" y="318" font-size="13" fill="#1a1a1a" text-anchor="end">tactile button</text>
    <line x1="230" y1="314" x2="410" y2="314" stroke="#1e8449" stroke-width="1.6"/>
    <rect x="540" y="300" width="100" height="26" rx="4" fill="#ffffff" stroke="#1e8449" stroke-width="1.4"/>
    <text x="590" y="317" font-size="12.5" fill="#1e8449" text-anchor="middle" font-weight="600">RX1 &#183; P10</text>
    <line x1="640" y1="314" x2="810" y2="314" stroke="#1e8449" stroke-width="1.6" marker-end="url(#arrowGreen)"/>
    <text x="870" y="318" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="600">D3 &#183; GPIO21</text>
  </g>

  <!-- Row 6: SEL -->
  <g>
    <text x="220" y="360" font-size="13" fill="#1a1a1a" text-anchor="end">BL0937 SEL</text>
    <line x1="230" y1="356" x2="410" y2="356" stroke="#2471a3" stroke-width="1.6" marker-start="url(#arrowBlue)"/>
    <rect x="540" y="342" width="100" height="26" rx="4" fill="#ffffff" stroke="#2471a3" stroke-width="1.4"/>
    <text x="590" y="359" font-size="12.5" fill="#1a4f73" text-anchor="middle" font-weight="600">P24</text>
    <line x1="640" y1="356" x2="810" y2="356" stroke="#2471a3" stroke-width="1.6"/>
    <text x="870" y="360" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="600">D2 &#183; GPIO2</text>
  </g>

  <!-- Row 7: TX1 (not connected) -->
  <g opacity="0.55">
    <text x="220" y="402" font-size="13" fill="#8a8f94" text-anchor="end" font-style="italic">not connected</text>
    <line x1="230" y1="398" x2="410" y2="398" stroke="#aab0b6" stroke-width="1.2" stroke-dasharray="3,3"/>
    <rect x="540" y="384" width="100" height="26" rx="4" fill="#f4f5f6" stroke="#aab0b6" stroke-width="1.2"/>
    <text x="590" y="401" font-size="12.5" fill="#8a8f94" text-anchor="middle">TX1</text>
    <line x1="640" y1="398" x2="810" y2="398" stroke="#aab0b6" stroke-width="1.2" stroke-dasharray="3,3"/>
    <text x="870" y="402" font-size="13" fill="#8a8f94" text-anchor="middle" font-style="italic">&#8212;</text>
  </g>

  <!-- Row 8: CF -->
  <g>
    <text x="220" y="444" font-size="13" fill="#1a1a1a" text-anchor="end">BL0937 CF (active power)</text>
    <line x1="230" y1="440" x2="410" y2="440" stroke="#2471a3" stroke-width="1.6"/>
    <rect x="540" y="426" width="100" height="26" rx="4" fill="#ffffff" stroke="#2471a3" stroke-width="1.4"/>
    <text x="590" y="443" font-size="12.5" fill="#1a4f73" text-anchor="middle" font-weight="600">P7</text>
    <line x1="640" y1="440" x2="810" y2="440" stroke="#2471a3" stroke-width="1.6" marker-end="url(#arrowBlue)"/>
    <text x="870" y="444" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="600">D0 &#183; GPIO0</text>
  </g>

  <!-- Row 9: CEN (not connected) -->
  <g opacity="0.55">
    <text x="220" y="486" font-size="13" fill="#8a8f94" text-anchor="end" font-style="italic">module reset (unused)</text>
    <line x1="230" y1="482" x2="410" y2="482" stroke="#aab0b6" stroke-width="1.2" stroke-dasharray="3,3"/>
    <rect x="540" y="468" width="100" height="26" rx="4" fill="#f4f5f6" stroke="#aab0b6" stroke-width="1.2"/>
    <text x="590" y="485" font-size="12.5" fill="#8a8f94" text-anchor="middle">CEN</text>
    <line x1="640" y1="482" x2="810" y2="482" stroke="#aab0b6" stroke-width="1.2" stroke-dasharray="3,3"/>
    <text x="870" y="486" font-size="13" fill="#8a8f94" text-anchor="middle" font-style="italic">&#8212;</text>
  </g>

  <!-- Row 10: CF1 -->
  <g>
    <text x="220" y="528" font-size="13" fill="#1a1a1a" text-anchor="end">BL0937 CF1 (V/I, muxed)</text>
    <line x1="230" y1="524" x2="410" y2="524" stroke="#2471a3" stroke-width="1.6"/>
    <rect x="540" y="510" width="100" height="26" rx="4" fill="#ffffff" stroke="#2471a3" stroke-width="1.4"/>
    <text x="590" y="527" font-size="12.5" fill="#1a4f73" text-anchor="middle" font-weight="600">P6</text>
    <line x1="640" y1="524" x2="810" y2="524" stroke="#2471a3" stroke-width="1.6" marker-end="url(#arrowBlue)"/>
    <text x="870" y="528" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="600">D1 &#183; GPIO1</text>
  </g>

  <!-- Row 11: ADC (not connected) -->
  <g opacity="0.55">
    <text x="220" y="570" font-size="13" fill="#8a8f94" text-anchor="end" font-style="italic">not connected</text>
    <line x1="230" y1="566" x2="410" y2="566" stroke="#aab0b6" stroke-width="1.2" stroke-dasharray="3,3"/>
    <rect x="540" y="552" width="100" height="26" rx="4" fill="#f4f5f6" stroke="#aab0b6" stroke-width="1.2"/>
    <text x="590" y="569" font-size="12.5" fill="#8a8f94" text-anchor="middle">ADC</text>
    <line x1="640" y1="566" x2="810" y2="566" stroke="#aab0b6" stroke-width="1.2" stroke-dasharray="3,3"/>
    <text x="870" y="570" font-size="13" fill="#8a8f94" text-anchor="middle" font-style="italic">&#8212;</text>
  </g>

  <!-- Legend -->
  <g font-size="12" fill="#555">
    <line x1="30" y1="600" x2="55" y2="600" stroke="#2471a3" stroke-width="1.6" marker-end="url(#arrowBlue)"/>
    <text x="62" y="604">into XIAO (it reads this)</text>
    <line x1="265" y1="600" x2="290" y2="600" stroke="#2471a3" stroke-width="1.6" marker-start="url(#arrowBlue)"/>
    <text x="297" y="604">out of XIAO (it drives this)</text>
    <line x1="545" y1="600" x2="570" y2="600" stroke="#aab0b6" stroke-width="1.2" stroke-dasharray="3,3"/>
    <text x="577" y="604">not connected</text>
  </g>
</svg>
